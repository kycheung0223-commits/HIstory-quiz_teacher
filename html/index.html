<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師題庫管理系統</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; color: #333; padding: 40px 20px; }
    .admin-card { background: white; width: 100%; max-width: 900px; margin: 0 auto; padding: 40px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .upload-area { border: 2px dashed #0071e3; background: #f8fafc; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; margin: 20px 0; transition: 0.2s; }
    .upload-area:hover { background: #f0f7ff; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .btn-group { display: flex; gap: 10px; }
    .btn-add { background: #34c759; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-export { background: #0071e3; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .preview-table th, .preview-table td { border: 1px solid #e5e5ea; padding: 10px; text-align: left; }
    .preview-table th { background: #f5f5f7; }
    .btn-delete { background: #ff3b30; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .status-msg { margin-top: 10px; font-weight: bold; color: #34c759; text-align: center; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>👨‍🏫 教師題庫管理系統</h2>
    <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">在此上載 Excel 或新增題目，並點擊「匯出 questions.json」發布至 GitHub。</p>
    
    <div class="upload-area" onclick="document.getElementById('excel-input').click()">
      <p style="font-size: 1.05rem; color: #0071e3; font-weight: 600;">點擊選擇 Excel 檔案 (.xlsx / .xls) 或拖曳至此</p>
      <input type="file" id="excel-input" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
    </div>
    <div id="status" class="status-msg"></div>

    <div class="toolbar">
      <h3>📊 目前題庫列表 (<span id="count-tag">0</span> 題)</h3>
      <div class="btn-group">
        <button class="btn-export" onclick="exportJSON()">📥 匯出 questions.json</button>
        <button class="btn-add" onclick="openModal()">+ 手動新增題目</button>
      </div>
    </div>

    <div style="overflow-x: auto; max-height: 400px;">
      <table class="preview-table">
        <thead>
          <tr>
            <th style="width: 15%;">篇章</th>
            <th style="width: 35%;">題目內容</th>
            <th style="width: 10%;">答案</th>
            <th style="width: 30%;">解析</th>
            <th style="width: 10%;">操作</th>
          </tr>
        </thead>
        <tbody id="preview-body">
          <tr><td colspan="5" style="text-align: center; color: #86868b;">暫無題目資料，請上載 Excel 或點擊新增。</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 新增題目 Modal -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">新增題目</h3>
      <div class="form-group"><label>篇章名稱</label><input type="text" id="m-chapter" placeholder="例如：篇章 1：長征背景"></div>
      <div class="form-group"><label>題目內容</label><textarea id="m-title" rows="2"></textarea></div>
      <div class="form-group"><label>選項 A</label><input type="text" id="m-optA"></div>
      <div class="form-group"><label>選項 B</label><input type="text" id="m-optB"></div>
      <div class="form-group"><label>選項 C</label><input type="text" id="m-optC"></div>
      <div class="form-group"><label>選項 D</label><input type="text" id="m-optD"></div>
      <div class="form-group">
        <label>正確答案</label>
        <select id="m-answer">
          <option value="A">A</option><option value="B">B</option>
          <option value="C">C</option><option value="D">D</option>
        </select>
      </div>
      <div class="form-group"><label>詳細解析</label><textarea id="m-explain" rows="2"></textarea></div>
      <div style="text-align: right; margin-top: 15px;">
        <button onclick="closeModal()" style="padding: 8px 15px; border: none; background: #ccc; border-radius: 6px; cursor: pointer;">取消</button>
        <button onclick="saveNewQuestion()" style="padding: 8px 15px; border: none; background: #0071e3; color: white; border-radius: 6px; cursor: pointer; margin-left: 8px;">儲存</button>
      </div>
    </div>
  </div>

  <script>
    let rawQuestions = JSON.parse(localStorage.getItem('quiz_questions')) || [];

    window.onload = function() {
      refreshTeacherTable();
    };

    function saveToStorage() {
      localStorage.setItem('quiz_questions', JSON.stringify(rawQuestions));
      refreshTeacherTable();
    }

    // 匯出 JSON 功能
    function exportJSON() {
      if (rawQuestions.length === 0) {
        alert('目前沒有任何題目可以匯出！');
        return;
      }

      // 將資料陣列轉成漂亮格式的 JSON 字串
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rawQuestions, null, 2));
      
      // 建立隱藏的下載連結
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "questions.json");
      document.body.appendChild(downloadAnchor);
      
      // 觸發下載
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        rawQuestions = [];
        for (let i = 1; i < jsonData.length; i++) {
          const row = jsonData[i];
          if (row && row.length >= 7) { 
            rawQuestions.push({
              chapter: String(row[0] || '').trim(),
              title: String(row[1] || '').trim(),
              options: { 
                A: String(row[2] || '').trim(), 
                B: String(row[3] || '').trim(), 
                C: String(row[4] || '').trim(), 
                D: String(row[5] || '').trim() 
              },
              answer: String(row[6] || '').trim().toUpperCase(),
              explanation: row[7] ? String(row[7]).trim() : '無詳細解析'
            });
          }
        }

        saveToStorage();
        document.getElementById('status').innerText = `✅ 成功匯入 ${rawQuestions.length} 道題目！請點擊右上方藍色按鈕下載 JSON。`;
      };
      reader.readAsArrayBuffer(file);
    }

    function refreshTeacherTable() {
      const tbody = document.getElementById('preview-body');
      document.getElementById('count-tag').innerText = rawQuestions.length;
      tbody.innerHTML = '';

      if (rawQuestions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #86868b;">暫無題目資料</td></tr>';
        return;
      }

      rawQuestions.forEach((q, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${q.chapter}</td>
          <td>${q.title}</td>
          <td><strong>${q.answer}</strong></td>
          <td>${q.explanation}</td>
          <td><button class="btn-delete" onclick="deleteQuestion(${index})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteQuestion(index) {
      if (confirm('確定要刪除這道題目嗎？')) {
        rawQuestions.splice(index, 1);
        saveToStorage();
      }
    }

    function openModal() { document.getElementById('add-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('add-modal').style.display = 'none'; }

    function saveNewQuestion() {
      const chapter = document.getElementById('m-chapter').value.trim();
      const title = document.getElementById('m-title').value.trim();
      const optA = document.getElementById('m-optA').value.trim();
      const optB = document.getElementById('m-optB').value.trim();
      const optC = document.getElementById('m-optC').value.trim();
      const optD = document.getElementById('m-optD').value.trim();
      const answer = document.getElementById('m-answer').value;
      const explanation = document.getElementById('m-explain').value.trim() || '無詳細解析';

      if (!title || !optA || !optB) {
        alert('請填寫題目與至少兩個選項！');
        return;
      }

      rawQuestions.push({
        chapter: chapter || '自訂題目',
        title,
        options: { A: optA, B: optB, C: optC, D: optD },
        answer,
        explanation
      });

      document.getElementById('m-chapter').value = '';
      document.getElementById('m-title').value = '';
      document.getElementById('m-optA').value = '';
      document.getElementById('m-optB').value = '';
      document.getElementById('m-optC').value = '';
      document.getElementById('m-optD').value = '';
      document.getElementById('m-explain').value = '';

      closeModal();
      saveToStorage();
    }
  </script>
</body>
</html>
